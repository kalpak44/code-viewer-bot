name: Publish VS Code Extension to Marketplace

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish (without leading v), for example 1.2.3"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-marketplace-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create or update release tag
        shell: bash
        run: |
          TAG="v${{ inputs.version }}"

          echo "Selected branch: ${{ github.ref_name }}"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Tag: $TAG"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Create the tag locally or move an existing tag to HEAD.
          git tag --force "$TAG" HEAD

          # Create the remote tag or move it if it already exists.
          git push origin "refs/tags/$TAG" --force

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install @vscode/vsce
        run: npm install -g @vscode/vsce

      - name: Download VSIX artifacts from GitHub release
        run: |
          mkdir -p dist
          gh release download "v${{ inputs.version }}" \
            --pattern "code-viewer-bot-*.vsix" \
            --dir dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify expected VSIX artifacts
        run: |
          ls -lah dist
          expected=(
            "code-viewer-bot-linux-x64.vsix"
            "code-viewer-bot-darwin-arm64.vsix"
            "code-viewer-bot-darwin-x64.vsix"
            "code-viewer-bot-win32-x64.vsix"
          )

          missing=0

          for file in "${expected[@]}"; do
            if [[ ! -f "dist/$file" ]]; then
              echo "Missing expected artifact: $file"
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            echo "Release v${{ inputs.version }} does not contain the full set of platform VSIX files."
            exit 1
          fi

      - name: Publish VSIX files to Visual Studio Marketplace
        run: |
          files=(
            "dist/code-viewer-bot-linux-x64.vsix"
            "dist/code-viewer-bot-darwin-arm64.vsix"
            "dist/code-viewer-bot-darwin-x64.vsix"
            "dist/code-viewer-bot-win32-x64.vsix"
          )

          for file in "${files[@]}"; do
            echo "Publishing $file"
            vsce publish --packagePath "$file" --skip-duplicate
          done
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
