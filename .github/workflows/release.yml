name: Release VS Code Extension

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release_version.outputs.release_tag }}

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Read release version from package.json
        id: release_version
        run: echo "release_tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Ensure GitHub release exists
        run: |
          gh release view "${{ steps.release_version.outputs.release_tag }}" >/dev/null 2>&1 || \
          gh release create "${{ steps.release_version.outputs.release_tag }}" \
            --target "${{ github.sha }}" \
            --title "${{ steps.release_version.outputs.release_tag }}" \
            --generate-notes \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: prepare-release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            asset_name: code-viewer-bot-linux-x64.vsix
          - os: macos-latest
            target: darwin-arm64
            asset_name: code-viewer-bot-darwin-arm64.vsix
          - os: macos-15-intel
            target: darwin-x64
            asset_name: code-viewer-bot-darwin-x64.vsix
          - os: windows-latest
            target: win32-x64
            asset_name: code-viewer-bot-win32-x64.vsix

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install @vscode/vsce
        run: npm install -g @vscode/vsce

      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libx11-dev \
            libxi-dev \
            libxtst-dev \
            libpng++-dev \
            pkg-config

      - name: Install dependencies
        run: npm ci
        env:
          SKIP_ROBOTJS_REBUILD: "1"

      - name: Build extension bundle
        run: npm run build

      - name: Rebuild robotjs
        run: npm rebuild robotjs || true

      - name: Package VSIX
        run: vsce package --target ${{ matrix.target }} --out ${{ matrix.asset_name }}

      - name: Upload Release Asset
        run: gh release upload "${{ needs.prepare-release.outputs.release_tag }}" "${{ matrix.asset_name }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
