    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18212f"/>
      <stop offset="100%" stop-color="#0d121b"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="92" y="64" width="1096" height="592" rx="22" fill="#111827" stroke="#324154" stroke-width="2"/>
  <rect x="132" y="110" width="300" height="34" rx="10" fill="#223044"/>
  <rect x="132" y="168" width="1016" height="148" rx="18" fill="#162131" stroke="#2a3b51"/>
